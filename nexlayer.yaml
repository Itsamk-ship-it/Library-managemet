application:
  name: library-management
  pods:
    - name: frontend
      servicePorts:
        - 80
      image: "registry.nexlayer.io/user_01kdnss9re3ack631zmxgpra36/library-managemet:9f197d8-fix2"
      path: /
    - name: backend
      servicePorts:
        - 4000
      image: "registry.nexlayer.io/user_01kdnss9re3ack631zmxgpra36/library-managemet:9f197d8-fix2"
      path: /api
      env:
        - name: DATABASE_URL
          value: postgresql://library:library@postgres.pod:5432/library?schema=public
        - name: REDIS_URL
          value: redis://redis.pod:6379
        - name: NODE_ENV
          value: production
    - name: postgres
      servicePorts:
        - 5432
      image: mirror.gcr.io/library/postgres:16-alpine
      path: /postgres
      env:
        - name: POSTGRES_USER
          value: library
        - name: POSTGRES_PASSWORD
          value: library
        - name: POSTGRES_DB
          value: library
    - name: redis
      servicePorts:
        - 6379
      image: mirror.gcr.io/library/redis:7-alpine
      path: /redis